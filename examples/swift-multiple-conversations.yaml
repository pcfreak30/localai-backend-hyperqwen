# Serve several Swift conversations. Choose GPUs separately.
name: swift-multiple-conversations
context_size: 32768
backend: hyperqwen
parameters:
  model: Swift-1.5-Qwen3.8-27B-W4A16-HyperQwen
  temperature: 0
template:
  use_tokenizer_template: true
env:
  HQ_PROFILE: "single"
  SPEC: "mtp"
  DRAFT_TOKENS: "2"
  CTX: "long"
  MAX_LEN: "32768"
  MAX_SEQS: "4"
  VISION: "0"
  PREFIX_CACHE: "1"
  API_SERVERS: "1"
  TOOLS: "1"
  EXTRA_ARGS: "--enforce-eager"
  HQ_STARTUP_TIMEOUT: "900"
  HQ_REQUEST_TIMEOUT: "900"
  VLLM_OFFLOAD_KEEP_SHM: "1"
