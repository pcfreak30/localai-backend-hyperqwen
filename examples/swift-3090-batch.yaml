# Swift batch settings for an RTX 3090.
# Use one profile per GPU to avoid loading the model twice.
name: swift-hyperqwen-3090-batch
backend: hyperqwen
parameters:
  model: Swift-1.5-Qwen3.8-27B-W4A16-HyperQwen
  temperature: 0
template:
  use_tokenizer_template: true
env:
  HQ_PROFILE: "batch"
  MAX_LEN: "4096"
  MAX_SEQS: "2"
  GPU_UTIL: "0.88"
  VISION: "0"
  # Batch uses int8 activations by default; an empty value turns them off.
  INT8_ACT: ""
  PTH_FA: "0"
  FA2_FP8KV: "0"
  PREFIX_CACHE: "1"
  API_SERVERS: "1"
  TOOLS: "1"
  EXTRA_ARGS: "--enforce-eager"
  HQ_STARTUP_TIMEOUT: "900"
  HQ_REQUEST_TIMEOUT: "900"
  VLLM_OFFLOAD_KEEP_SHM: "1"
